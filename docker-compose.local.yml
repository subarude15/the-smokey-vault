# Local / laptop compose for The Smokey Barrel Bar.
# Builds from this directory and mounts ./data. Do not use this on the NAS —
# production is docker-compose.yml (published image + Watchtower).
#
#   docker compose -f docker-compose.local.yml up -d --build

services:
  smokey-vault:
    build: .
    image: the-smokey-vault:latest
    container_name: smokey-vault
    restart: unless-stopped
    ports:
      - "6616:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_PATH: /data/smokeyvault.db
      GOVERNMENT_CATALOG_DB_PATH: /app/data/government-catalog.sqlite
      SESSION_SECRET: ${SESSION_SECRET:-change-this-on-your-server}
      DEFAULT_PIN: ${DEFAULT_PIN:-1234}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      COLA_API_KEY: ${COLA_API_KEY:-}
      COLA_BURST_LIMIT: ${COLA_BURST_LIMIT:-10}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FWGS_DELAY_MS: ${FWGS_DELAY_MS:-400}
      FIGRANIUM_BASE_URL: ${FIGRANIUM_BASE_URL:-https://fig.thesmokeybarrelbar.com}
      FIGRANIUM_API_KEY: ${FIGRANIUM_API_KEY:-}
      FIGRANIUM_TIMEOUT_MS: ${FIGRANIUM_TIMEOUT_MS:-}
      FIGRANIUM_FWGS_RESOLVER_TASK_ID: ${FIGRANIUM_FWGS_RESOLVER_TASK_ID:-}
      FIGRANIUM_FWGS_IMAGE_TASK_ID: ${FIGRANIUM_FWGS_IMAGE_TASK_ID:-}
    volumes:
      # Same host ./data folder at /data (vault) and /app/data (government catalogs).
      - ./data:/data
      - ./data:/app/data
