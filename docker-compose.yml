services:
  smokey-vault:
    build: .
    image: the-smokey-vault:latest
    container_name: smokey-vault
    restart: unless-stopped
    ports:
      - "6616:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_PATH: /data/smokeyvault.db
      SESSION_SECRET: ${SESSION_SECRET:-change-this-on-your-server}
      DEFAULT_PIN: ${DEFAULT_PIN:-1234}
      ADMIN_PIN: ${ADMIN_PIN:-}
      MASTER_PIN: ${MASTER_PIN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      COLA_API_KEY: ${COLA_API_KEY:-}
      COLA_BURST_LIMIT: ${COLA_BURST_LIMIT:-10}
      BREWFATHER_USER_ID: ${BREWFATHER_USER_ID:-}
      BREWFATHER_API_KEY: ${BREWFATHER_API_KEY:-}
    volumes:
      - ./data:/data
