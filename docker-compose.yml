# Synology / NAS compose for The Smokey Barrel Bar.
# Do not replace this with docker-compose.local.yml — that one builds locally
# and mounts ./data. This stack pulls the published image and keeps Watchtower.
#
# Keys come from the .env sitting next to this file. Recreate the container
# after editing either file:  docker compose up -d
# In Container Manager: Project → Build / Recreate (not just Restart).

version: "3.8"

services:
  the-smokey-vault:
    image: ghcr.io/subarude15/the-smokey-vault:latest
    container_name: smokey-vault
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Published on all interfaces. Combined with TRUST_PROXY=true, a client that
      # hits :6616 directly can spoof X-Forwarded-For. The PIN unlock route now has
      # a global backstop. If the Synology reverse proxy is the only entry, bind
      # localhost instead: "127.0.0.1:6616:8080"
      - "6616:8080"
    volumes:
      # Vault DB lives at DB_PATH=/data/smokeyvault.db.
      # Government catalogs prefer /app/data/government-catalog.sqlite.
      # Dual-mount the same host folder so both paths are persistent and survive redeploy.
      # (An empty /app/data-only mount previously left the live site on an unused volume.)
      - /volume1/docker/thesmokeyvault/data:/data
      - /volume1/docker/thesmokeyvault/data:/app/data
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_PATH: /data/smokeyvault.db
      GOVERNMENT_CATALOG_DB_PATH: /app/data/government-catalog.sqlite
      # Public hostname sits behind the Synology reverse proxy.
      TRUST_PROXY: "true"
      SESSION_SECRET: ${SESSION_SECRET:-}
      DEFAULT_PIN: ${DEFAULT_PIN:-}
      ADMIN_PIN: ${ADMIN_PIN:-}
      MASTER_PIN: ${MASTER_PIN:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      COLA_API_KEY: ${COLA_API_KEY:-}
      COLA_BURST_LIMIT: ${COLA_BURST_LIMIT:-10}
      FWGS_DELAY_MS: ${FWGS_DELAY_MS:-400}
      FIGRANIUM_BASE_URL: ${FIGRANIUM_BASE_URL:-https://fig.thesmokeybarrelbar.com}
      FIGRANIUM_API_KEY: ${FIGRANIUM_API_KEY:-}
      FIGRANIUM_TIMEOUT_MS: ${FIGRANIUM_TIMEOUT_MS:-}
      FIGRANIUM_FWGS_RESOLVER_TASK_ID: ${FIGRANIUM_FWGS_RESOLVER_TASK_ID:-}
      FIGRANIUM_FWGS_IMAGE_TASK_ID: ${FIGRANIUM_FWGS_IMAGE_TASK_ID:-}
      BREWFATHER_USER_ID: ${BREWFATHER_USER_ID:-}
      BREWFATHER_API_KEY: ${BREWFATHER_API_KEY:-}

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
