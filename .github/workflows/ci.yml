name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr136-source-patch:
    if: github.head_ref == 'pr136-cocktail-cards'
    name: apply-pr136-source-patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr136-cocktail-cards
      - name: Patch App.tsx once
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('client/src/App.tsx')
          source = path.read_text()
          if 'import { CocktailCard } from "./CocktailCard";' in source:
              raise SystemExit(0)

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              'import { SpiritInventoryCard, TapInventoryCard } from "./TapSpiritInventoryCard";\nimport { BottlePublicContent, TastingProfileView } from "./BottlePublicContent";',
              'import { SpiritInventoryCard, TapInventoryCard } from "./TapSpiritInventoryCard";\nimport { CocktailCard } from "./CocktailCard";\nimport { BottlePublicContent, TastingProfileView } from "./BottlePublicContent";',
              'CocktailCard import'
          )
          replace_once(
              '  const [loadError, setLoadError] = useState("");\n  const mixologistSectionRef = useRef<HTMLElement | null>(null);',
              '  const [loadError, setLoadError] = useState("");\n  const [favoriteBusy, setFavoriteBusy] = useState<number | null>(null);\n  const mixologistSectionRef = useRef<HTMLElement | null>(null);',
              'favorite busy state'
          )
          replace_once(
              '''  function surprise() {
    if (!ready.length) return;
    setSelected(ready[Math.floor(Math.random() * ready.length)]);
  }
  return <>''',
              '''  function surprise() {
    if (!ready.length) return;
    setSelected(ready[Math.floor(Math.random() * ready.length)]);
  }
  async function toggleCardFavorite(drink: CocktailDrink) {
    if (!admin || favoriteBusy != null) return;
    const id = Number(drink.id);
    setFavoriteBusy(id);
    setLoadError("");
    try {
      await api<CocktailDrink>(`/cocktails/${drink.id}`, {
        method: "PUT",
        body: JSON.stringify({ bartender_fav: Number(drink.bartender_fav) <= 0 })
      });
      load();
    } catch (err) {
      setLoadError(err instanceof Error ? err.message : "Could not update favorite.");
    } finally {
      setFavoriteBusy(null);
    }
  }
  return <>''',
              'card favorite action'
          )
          replace_once(
              '''      <div className="recipe-grid">{shown.map((drink) => {
        const lines = cocktailLines(drink);
        const preview = lines.slice(0, 3);
        return (
          <button className="recipe-card" key={drink.id} onClick={() => setSelected(drink)}>
            {drink.image_url ? <img className="recipe-thumb" src={String(drink.image_url)} alt={drink.name}/> : null}
            <span className={`status ${drink.readiness}`}>{readinessLabel(drink.readiness, !admin)}</span>
            {Number(drink.bartender_fav) > 0 && <span className="fav-tag">Favorite</span>}
            {drink.season !== "All" && <span className="season-tag">{drink.season}</span>}
            <h3>{drink.name}</h3>
            <p>{drink.method} · {drink.glassware}</p>
            <ul className="ingredient-preview">{preview.map((line) => <li key={line.text} className={line.state}>{line.text}</li>)}</ul>
            {lines.length > 3 ? <small>+{lines.length - 3} more</small> : null}
            {drink.missing.length > 0 && <small>Missing: {drink.missing.join(", ")}</small>}
          </button>
        );
      })}</div>''',
              '''      <div className="recipe-grid cocktail-card-grid">{shown.map((drink) => (
        <CocktailCard
          key={drink.id}
          drink={drink}
          admin={admin}
          onOpen={() => setSelected(drink)}
          onToggleFavorite={admin ? () => { void toggleCardFavorite(drink); } : undefined}
          favoriteBusy={favoriteBusy === Number(drink.id)}
        />
      ))}</div>''',
              'cocktail grid'
          )
          replace_once(
              '<span className="mark" aria-hidden="true">{line.state === "missing" ? "○" : line.state === "substitute" ? "◐" : "●"}</span>',
              '<span className="mark" aria-hidden="true">{line.state === "missing" ? "✕" : line.state === "substitute" ? "↔" : "✓"}</span>',
              'ingredient state marks'
          )
          replace_once(
              '                    {line.state === "pantry" ? <small> · pantry</small> : null}\n',
              '                    {line.state === "pantry" ? <small> · pantry</small> : null}\n                    {line.state === "missing" ? <small> · Restock needed</small> : null}\n',
              'missing ingredient detail'
          )
          path.write_text(source)
          PY
          if git diff --quiet -- client/src/App.tsx; then
            exit 0
          fi
          git diff --check -- client/src/App.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.tsx
          git commit -m "feat: wire PR136 cocktail cards"
          git push origin HEAD:pr136-cocktail-cards

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # better-sqlite3 / sharp native builds (same stack as Dockerfile)
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 make g++

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck + client/server build
        run: npm run build

      - name: Catalog import runtime (dist CLIs)
        run: npm run test:catalog-import-runtime

  catalog-import-docker:
    name: catalog-import-docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 make g++

      - name: Install dependencies
        run: npm ci

      - name: Docker runtime catalog import verification
        run: bash scripts/verify-catalog-import-runtime.sh
