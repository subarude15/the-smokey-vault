name: PR135 one-shot docs

on:
  push:
    branches:
      - chatgpt/pr135-taps-spirits-ergonomics
    paths:
      - scripts/pr135-docs.mjs
      - .github/workflows/pr135-docs.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pr135-taps-spirits-ergonomics
          fetch-depth: 0
      - name: Apply PR135 docs
        run: node scripts/pr135-docs.mjs
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: mark PR135 complete and queue PR136 [skip ci]"
          git push origin HEAD:chatgpt/pr135-taps-spirits-ergonomics
