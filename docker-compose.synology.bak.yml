version: "3.8"

services:
  the-smokey-vault:
    image: ghcr.io/subarude15/the-smokey-vault:latest
    container_name: smokey-vault
    restart: unless-stopped
    ports:
      - "6616:8080"
    volumes:
      - /volume1/docker/thesmokeyvault/data:/app/data
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=1800AlsacerdReadingPa19604
      - DEFAULT_PIN=6616
      # Optional AI integrations:
      # - AI_PROVIDER=ollama
      # - AI_MODEL=llama3.2-vision
      # - AI_API_KEY=
  
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
